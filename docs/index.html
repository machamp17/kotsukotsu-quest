<meta property="og:description" content="訪問診療医になって、町の仲間とつながりながら患者さんを支えるレトロRPG。スマホで遊べます。">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>/* こつこつクリニック クエスト - single committed daytime look (no dark theme by design). */
:root {
  --ink: #2e2a3a;
  --teal: #2bb3a8;
  --teal-deep: #135a5c;
  --teal-light: #7fe0d4;
  --window: rgba(16, 78, 82, 0.9);
  --window-solid: #10504f;
  --sky: #4fbdf0;
  --sky-pale: #bdebfc;
  --sun: #ffd45a;
  --paper: #ffffff;
  --grass: #7fd35c;
  --page: #a6e3fa;
  --danger: #ff9b8a;
  --font: "DotGothic16", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --controls-h: 176px;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--page);
  color: var(--paper);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
}

*, *::before, *::after { box-sizing: border-box; }
button { font-family: inherit; }
p, h1, h2, ol, ul { margin: 0; }
.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

#app {
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    linear-gradient(180deg, var(--sky) 0%, var(--sky-pale) 60%, var(--grass) 60%, #63b84a 100%);
}

#frame {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100%;
  overflow: hidden;
  background: #173c40;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

@media (min-width: 560px) and (min-height: 700px) {
  #frame {
    height: min(100%, 920px);
    border: 4px solid var(--paper);
    border-radius: 18px;
    box-shadow: 0 0 0 4px var(--ink), 0 20px 50px rgba(20, 60, 70, 0.35);
  }
}

.screen { position: absolute; inset: 0; }
.screen[hidden] { display: none !important; }

/* ---------- shared window & choice styles ---------- */
.window {
  background: var(--window);
  color: var(--paper);
  border: 3px solid var(--paper);
  border-radius: 8px;
  box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px rgba(0, 0, 0, 0.18);
}

.choice {
  position: relative;
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 8px 12px 8px 30px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--paper);
  font-size: 16px;
  line-height: 1.4;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.choice.is-active { background: rgba(255, 255, 255, 0.12); }
.choice.is-active::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 50%;
  margin-top: -6px;
  border-style: solid;
  border-width: 6px 0 6px 9px;
  border-color: transparent transparent transparent var(--sun);
  animation: nudge 0.8s steps(2) infinite;
}
.choice:disabled { opacity: 0.4; cursor: default; }
.choice:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }

@keyframes nudge { 50% { transform: translateX(3px); } }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- title ---------- */
#screen-title { display: flex; flex-direction: column; background: var(--sky); }
.title-sky { position: relative; flex: 0 0 40%; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.title-town { position: relative; flex: 1 1 auto; overflow: hidden; display: flex; justify-content: center; }
#title-sky { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
#title-town { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }

.logo {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 8%;
  font-weight: normal;
  line-height: 1.05;
  white-space: nowrap;
  text-align: center;
}
.logo { animation: logo-drop 0.9s steps(9, end) both; }
.logo-float { position: relative; display: flex; flex-direction: column; align-items: center; animation: logo-bob 1.6s steps(1, end) 1s infinite; }
/* 「こつこつクリニック」はリボンの帯に */
.logo-top {
  position: relative;
  z-index: 1;
  padding: 3px 16px 5px;
  font-size: clamp(20px, 6.6vw, 30px);
  color: var(--paper);
  letter-spacing: 0.06em;
  background: linear-gradient(180deg, #4fd0c4 0 48%, var(--teal) 48% 100%);
  border: 3px solid var(--ink);
  border-radius: 3px;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 #1f8f86, 0 4px 0 var(--ink);
  text-shadow: 0 2px 0 var(--teal-deep), 2px 0 0 var(--teal-deep), -2px 0 0 var(--teal-deep), 0 -2px 0 var(--teal-deep);
}
.logo-tail {
  position: absolute;
  z-index: -1;
  top: 9px;
  width: 26px;
  height: calc(100% + 2px);
  background: var(--ink);
}
.logo-tail::after { content: ""; position: absolute; inset: 3px; background: var(--teal-deep); }
.logo-tail-l { left: -20px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%); }
.logo-tail-r { right: -20px; clip-path: polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%); }
.logo-tail-l::after { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%); }
.logo-tail-r::after { clip-path: polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%); }
/* 「クエスト」は段々グラデーション＋厚みのある縁取り */
.logo-main {
  position: relative;
  display: inline-block;
  margin-top: 2px;
  font-size: clamp(56px, 19vw, 88px);
  color: var(--sun);
  letter-spacing: 0.06em;
  text-shadow:
    3px 0 0 var(--teal-deep), -3px 0 0 var(--teal-deep), 0 3px 0 var(--teal-deep), 0 -3px 0 var(--teal-deep),
    3px 3px 0 var(--teal-deep), -3px 3px 0 var(--teal-deep), 3px -3px 0 var(--teal-deep), -3px -3px 0 var(--teal-deep),
    0 6px 0 var(--teal-deep), 3px 6px 0 var(--teal-deep), -3px 6px 0 var(--teal-deep),
    0 9px 0 var(--ink), 3px 9px 0 var(--ink), -3px 9px 0 var(--ink);
}
.logo-main::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  color: transparent;
  text-shadow: none;
  background:
    linear-gradient(115deg, transparent 0 44%, rgba(255, 255, 255, 0.85) 44% 47%, transparent 47% 100%),
    linear-gradient(180deg, #fffbe2 0 24%, #ffe066 24% 50%, #ffc43a 50% 76%, #f7962a 76% 100%);
  background-size: 320% 100%, 100% 100%;
  background-position: 120% 0, 0 0;
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  animation: logo-shine 5s steps(24, end) 1.4s infinite;
}
.logo-sub {
  margin-top: 12px;
  padding: 2px 12px;
  font-size: clamp(13px, 3.8vw, 16px);
  color: var(--paper);
  letter-spacing: 0.2em;
  background: rgba(19, 90, 92, 0.78);
  border-radius: 2px;
  box-shadow: 0 0 0 2px var(--ink);
}
/* きらきら（ドットの星） */
.logo-spark {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #ffffff;
  box-shadow: 0 -4px 0 #ffffff, 0 4px 0 #ffffff, -4px 0 0 #ffffff, 4px 0 0 #ffffff,
    0 -8px 0 rgba(255, 255, 255, 0.55), 0 8px 0 rgba(255, 255, 255, 0.55), -8px 0 0 rgba(255, 255, 255, 0.55), 8px 0 0 rgba(255, 255, 255, 0.55);
  opacity: 0;
  animation: logo-twinkle 2.4s steps(1, end) infinite;
}
.logo-spark.sp1 { left: -6%; top: 46%; animation-delay: 1.2s; }
.logo-spark.sp2 { right: -4%; top: 30%; animation-delay: 2s; }
.logo-spark.sp3 { right: 8%; top: 84%; animation-delay: 2.8s; }
@keyframes logo-drop {
  0% { transform: translateY(-46px); opacity: 0; }
  40% { opacity: 1; }
  70% { transform: translateY(5px); }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes logo-bob { 0% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes logo-shine { 0% { background-position: 120% 0, 0 0; } 45%, 100% { background-position: -20% 0, 0 0; } }
@keyframes logo-twinkle { 0% { opacity: 0; transform: scale(0.5); } 10% { opacity: 1; transform: scale(1); } 22% { opacity: 0.6; transform: scale(0.75); } 30%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .logo, .logo-float, .logo-main::after, .logo-spark { animation: none; }
  .logo-spark { opacity: 0; }
}
.sound-chip {
  position: absolute;
  z-index: 2;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 12px;
  min-height: 40px;
  padding: 6px 12px;
  border: 2px solid var(--paper);
  border-radius: 20px;
  background: rgba(19, 90, 92, 0.85);
  color: var(--paper);
  font-size: 14px;
}
.title-bottom {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.title-menu { width: min(300px, 100%); padding: 8px; }
.title-menu .choice { font-size: 19px; }
.title-brand {
  padding: 4px 12px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.9);
  color: var(--teal-deep);
  font-size: 14px;
  box-shadow: 0 0 0 2px var(--ink);
}

/* ---------- setup ---------- */
#screen-setup {
  overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px;
  background: linear-gradient(180deg, var(--sky), var(--sky-pale));
}
.setup { max-width: 400px; margin: 0 auto; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.setup-heading { font-size: 20px; font-weight: normal; text-align: center; }
.setup-label { font-size: 15px; color: var(--teal-light); }
.name-row { display: flex; align-items: center; gap: 8px; }
#name-input {
  flex: 1;
  min-width: 0;
  height: 48px;
  padding: 0 12px;
  border: 3px solid var(--paper);
  border-radius: 6px;
  background: #0b3a3a;
  color: var(--paper);
  font-family: var(--font);
  font-size: 20px;
  -webkit-user-select: text;
  user-select: text;
}
#name-input:focus { outline: 3px solid var(--sun); outline-offset: 1px; }
.name-suffix { font-size: 18px; }
.setup-error { min-height: 1.4em; font-size: 14px; color: var(--danger); }
.avatar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.avatar-card {
  display: grid;
  grid-template-columns: auto auto;
  justify-content: center;
  align-items: end;
  gap: 6px 10px;
  padding: 12px 6px 10px;
  border: 3px solid rgba(255, 255, 255, 0.35);
  border-radius: 8px;
  background: linear-gradient(180deg, #8fdaf8 0 55%, var(--grass) 55%);
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
}
.avatar-card[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 2px var(--ink); }
.avatar-card span { grid-column: 1 / -1; padding: 2px 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.9); }
.avatar-walk { width: 48px; height: 72px; }
.avatar-face { width: 64px; height: 64px; background: rgba(255, 255, 255, 0.6); border-radius: 4px; }
.setup-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: 4px; }
.setup-actions .choice { border: 2px solid rgba(255, 255, 255, 0.4); }
#setup-start { background: var(--teal); border-color: var(--paper); }

/* ---------- game layout ---------- */
#screen-game { display: flex; flex-direction: column; }

#hud {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) 8px 6px;
  background: linear-gradient(180deg, #1d8b83, #16706a);
  border-bottom: 3px solid var(--paper);
  box-shadow: 0 2px 0 var(--ink);
  z-index: 5;
}
.hud-top { display: flex; align-items: center; gap: 6px; }
.hud-chapter { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--teal-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-objective-row { display: flex; align-items: flex-start; gap: 6px; }
.hud-tag { flex: 0 0 auto; padding: 1px 5px; border-radius: 3px; background: var(--sun); color: var(--ink); font-size: 12px; line-height: 1.5; }
.hud-objective { font-size: 15px; line-height: 1.35; }
.hud-objective.is-new { animation: blink 0.25s steps(1) 4; }
.hud-items { flex: 0 0 auto; display: flex; gap: 4px; }
.hud-items canvas { width: 28px; height: 28px; background: rgba(255, 255, 255, 0.92); border-radius: 4px; box-shadow: 0 0 0 2px var(--ink); }
.hud-btn {
  flex: 0 0 auto;
  min-height: 34px;
  min-width: 56px;
  padding: 3px 8px;
  border: 2px solid var(--paper);
  border-radius: 6px;
  background: var(--teal-deep);
  color: var(--paper);
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  touch-action: manipulation;
}
.hud-btn:focus-visible, .sound-chip:focus-visible, #btn-a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.menu-lines { width: 12px; height: 10px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; position: relative; }
.menu-lines::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; border-top: 2px solid currentColor; }

#viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: #2e2a3a;
  touch-action: none;
}
#world { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

/* ---------- dialogue ---------- */
#talk {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 8px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  pointer-events: none;
}
#talk > * { pointer-events: auto; }
.choices { width: min(100%, 320px); padding: 6px; max-height: 60vh; overflow-y: auto; }
.dlg { position: relative; width: 100%; padding: 16px 14px 14px; background: rgba(16, 78, 82, 0.86); cursor: pointer; }
.dlg.is-narration { background: rgba(28, 44, 60, 0.86); }
.dlg.is-thought .dlg-text { color: #d9f5ff; font-style: normal; }
.dlg-name {
  position: absolute;
  top: -15px;
  left: 10px;
  padding: 2px 10px;
  border-radius: 4px;
  background: var(--paper);
  color: var(--teal-deep);
  font-size: 14px;
  box-shadow: 0 0 0 2px var(--ink);
}
.dlg-name[hidden] { display: none; }
.dlg-body { display: flex; gap: 12px; align-items: flex-start; }
.dlg-face { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 4px; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 2px var(--ink); }
.dlg-face[hidden] { display: none; }
.dlg-text { flex: 1 1 auto; min-width: 0; min-height: calc(1.65em * 3); font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
.dlg-next {
  position: absolute;
  right: 12px;
  bottom: 6px;
  border-style: solid;
  border-width: 8px 6px 0 6px;
  border-color: var(--sun) transparent transparent transparent;
  opacity: 0;
}
.dlg.is-done .dlg-next { opacity: 1; animation: blink 0.8s steps(1) infinite; }

/* ---------- overlays ---------- */
#overlay { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#overlay > * { pointer-events: auto; }
.card-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(16, 40, 44, 0.45);
  cursor: pointer;
}
.card { width: min(100%, 360px); padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; animation: pop 0.25s ease-out; }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } }
.card-title { font-size: 18px; color: var(--sun); }
.card-text { font-size: 16px; line-height: 1.65; }
.card-eyebrow { font-size: 13px; color: var(--teal-light); letter-spacing: 0.08em; }
.card-hint { align-self: flex-end; font-size: 12px; color: var(--teal-light); }
.item-get { display: flex; gap: 12px; align-items: center; }
.item-get canvas { flex: 0 0 auto; width: 64px; height: 64px; background: rgba(255, 255, 255, 0.95); border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); }
.is-join .card { align-items: center; text-align: center; }
.join-rays { padding: 14px; border-radius: 50%; background: radial-gradient(circle, #fff6c0 0 45%, rgba(255, 214, 90, 0.5) 46% 60%, transparent 61%); }
.join-face { display: block; width: 96px; height: 96px; background: var(--paper); border-radius: 8px; box-shadow: 0 0 0 3px var(--ink); }
.join-title { font-size: 20px; white-space: pre-line; line-height: 1.4; }
.ability { width: 100%; padding: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); text-align: left; }
.ability-label { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 3px; background: var(--teal-light); color: var(--ink); font-size: 12px; }
.ability strong { font-weight: normal; font-size: 17px; color: var(--sun); }
.ability p { margin-top: 6px; font-size: 15px; line-height: 1.6; }
.lesson { font-size: 17px; }
.is-chapter .card { text-align: center; align-items: center; gap: 12px; }
.chapter-title { font-size: 26px; color: var(--sun); }
.chapter-sub { font-size: 16px; }
.chapter-foot { font-size: 14px; line-height: 1.6; color: var(--teal-light); }
.chapter-brand { margin-top: 4px; padding: 4px 10px; border-radius: 4px; background: var(--paper); color: var(--teal-deep); font-size: 14px; }
.howto { display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.6; }
.howto p { display: flex; gap: 10px; align-items: center; }
.key-a { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: var(--sun); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font: 700 16px Arial, sans-serif; }
.key-dpad { flex: 0 0 auto; width: 32px; height: 32px; position: relative; }
.key-dpad::before, .key-dpad::after { content: ""; position: absolute; background: var(--paper); border-radius: 2px; }
.key-dpad::before { left: 11px; top: 0; width: 10px; height: 32px; }
.key-dpad::after { top: 11px; left: 0; width: 32px; height: 10px; }
.phone { display: flex; gap: 14px; align-items: center; }
.phone-icon { flex: 0 0 auto; width: 34px; height: 48px; border-radius: 6px; background: var(--paper); box-shadow: 0 0 0 2px var(--ink); position: relative; animation: ring 0.18s steps(2) infinite; }
.phone-icon::before { content: ""; position: absolute; left: 5px; right: 5px; top: 6px; bottom: 12px; background: var(--teal); border-radius: 2px; }
.phone-icon::after { content: ""; position: absolute; left: 13px; bottom: 3px; width: 8px; height: 6px; border-radius: 3px; background: var(--teal-deep); }
@keyframes ring { 50% { transform: rotate(8deg); } }

/* menu */
.menu-wrap { position: absolute; inset: 0; padding: 10px; background: rgba(16, 40, 44, 0.5); display: flex; }
.menu { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px; }
.menu-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.menu h2 { font-size: 14px; font-weight: normal; color: var(--sun); margin-bottom: 6px; }
.menu-objective { font-size: 16px; }
.menu-synopsis { padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.6; }
.menu-party, .menu-items { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.menu-party li, .menu-items li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5; }
.menu-party canvas, .menu-items canvas { flex: 0 0 auto; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.92); border-radius: 4px; }
.menu-party strong, .menu-items strong { font-weight: normal; color: var(--teal-light); }
.menu-party p, .menu-items p { font-size: 14px; }

kqm_kotsukotsu:[
 {when:{all:["gameClear"]},script:[{say:"kotsukotsu",text:"{name}先生、おつかれさま。今日も一日、こつこつと。明日も、こつこつと。"}]},
 {when:{none:["met_kotsukotsu"]},script:[
  {say:"kotsukotsu",text:"やあ、{name}先生！ ぼくはコツコツ先生。こつこつクリニックの、骨の先生だよ。"},
  {say:"kotsukotsu",text:"「こつこつ」には、2つの意味があるんだ。ひとつは、自分で立つ・歩く・食べる。毎日の動作を守ること。"},
  {say:"kotsukotsu",text:"もうひとつは、積み重ね。決めた日に伺って、小さな変化に気づいて、確実に対応する。"},
  {kqmMet:"kotsukotsu"},
  {say:"kotsukotsu",text:"町のあちこちに、ぼくの仲間の先生たちがいるよ。全員に会えるかな？"},{save:!0}]},
 {when:{none:["xrayExamDone"]},script:[{say:"kotsukotsu",text:"ウメさん、転んで腰を痛めたんだって……。骨のことは、ぼくもとっても心配だよ。"}]},
 {script:[{say:"kotsukotsu",text:"家で暮らし続けるには、歩けることが大事。手すり1本で、毎日が変わることもあるんだ。"}]}
],
kqm_dokkun:[
 {when:{all:["gameClear"]},script:[{say:"dokkun",text:"町のみんなの胸の音が、今日もおだやかでありますように。ドックン。"}]},
 {when:{none:["met_dokkun"]},script:[
  {say:"dokkun",text:"ドックン、ドックン！ ぼくはドックン先生。心臓の先生だよ。"},

  {kqmMet:"dokkun"},{save:!0}]},
 {when:{all:["ecgDone"]},script:[{say:"dokkun",text:"田中さんのこと、看護師さんの「いつもと違う」があったから、早くつなげられたんだ。在宅医療は、ワンチームだね！"}]},
 {script:[{say:"dokkun",text:"心電図は、心臓の電気の記録。早く病院へ届くほど、次の治療につながるんだ。"}]}
],
kqm_meguru:[
 {when:{all:["gameClear"]},script:[{say:"meguru",text:"町じゅうに、気づきと情報がめぐるようになったね。わたし、うれしい！"}]},
 {when:{none:["met_meguru"]},script:[

  {kqmMet:"meguru"},{save:!0}]},
 {script:[{say:"meguru",text:"看護師さん、薬剤師さん、ケアマネさん。みんなの気づきがめぐると、先生の診療もよくなるのよ。"}]}
],
kqm_suu:[
 {when:{all:["gameClear"]},script:[{say:"suu",text:"「スー」「ハー」　町の空気が、すっかり軽くなったね。"}]},
 {when:{none:["met_suu"]},script:[

  {say:"suu",text:"不安なときは、まず深呼吸。「スー」で吸って、「ハー」で吐く。ほら、少し落ち着くでしょ？"},
  {kqmMet:"suu"},{save:!0}]},
 {when:{all:["askedForXray"],none:["moyaCleared"]},script:[{say:"suu",text:"ウメさんの家のあたりに、紫のモヤが出るんだって。あわてずに、深呼吸してから向き合ってね。"}]},
 {script:[{say:"suu",text:"息が苦しいのは、とてもこわいこと。だから家でも、呼吸の様子はていねいに見るんだよ。"}]}
],
kqm_kokoro:[

 {when:{none:["met_kokoro"]},script:[
  {say:"kokoro",text:"こんにちは。ココロちゃん先生です。こころの先生をしています。"},

  {kqmMet:"kokoro"},{save:!0}]},
 {when:{all:["echoDone"]},script:[{say:"kokoro",text:"木村さんの娘さん、少し笑顔が戻ったみたい。ご家族が、ご自身の暮らしも大切にできたらうれしいな。"}]},
 {script:[{say:"kokoro",text:"ご本人を支えること。ご家族を、ひとりにしないこと。どちらも、訪問診療の大事なお仕事よ。"}]}
],

  {say:"zendou",text:"ぐるぐる〜。ぜんどう先生です。おなかの先生だよ。"},

  {kqmMet:"zendou"},{save:!0}]},
 {script:[{say:"zendou",text:"食べること、出すこと。毎日のあたりまえが、暮らしの土台なんだよね。"}]}

kqm_kaname:[
 {when:{all:["gameClear"]},script:[{say:"kaname",text:"目立たない仕事を、今日もこつこつ。みなさん、おつかれさまでした。"}]},
 {when:{none:["met_kaname"]},script:[
  {say:"kaname",text:"かなめ先生です。肝臓は、体の「かなめ」。目立たないけれど、毎日だまって働いています。"},
  {say:"kaname",text:"訪問前の準備、記録、連絡、振り返り。努力は、光の当たらない場所で育つんですよ。"},
  {kqmMet:"kaname"},{save:!0}]},
 {script:[{say:"kaname",text:"連携の書類も、一枚一枚がだれかの安心につながっています。地味だけど、大事なお仕事です。"}]}
],
kqm_guu:[
 {when:{all:["gameClear"]},script:[{say:"guu",text:"グ〜。安心したら、おなかがすいてきちゃった。"}]},
 {when:{none:["met_guu"]},script:[

  {say:"guu",text:"飲んだお薬は、まずぼくのところに届くんだ。だから、飲み間違いには気をつけてね。"},

 {when:{all:["pharmacistJoined"]},script:[{say:"guu",text:"薬剤師さんが、薬袋を色分けしてくれたんだって。ハルさん、飲み間違いが減ったみたい！"}]},
 {script:[{say:"guu",text:"薬局はすぐそこだよ。お薬のことは、薬剤師さんがいちばん頼りになるんだ。"}]}
],
kqm_ganchan:[
 {when:{all:["gameClear"]},script:[{say:"ganchan",text:"ハルさん、見やすい薬袋を使いながら、ご家族との電話を楽しみにしてるんだって。"}]},

  {say:"ganchan",text:"見え方が変わると、暮らしも変わる。薬の文字、段差、人の顔。目だけじゃなく、暮らしごと見てほしいんだ。"},
  {kqmMet:"ganchan"},{save:!0}]},
 {script:[{say:"ganchan",text:"小さな変化に気づくには、よく見ること。……ぼくが言うと、説得力あるでしょ？"}]}

  c=p.toCanvas();ne.set(k,c);return c;
