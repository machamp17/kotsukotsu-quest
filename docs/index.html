<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="訪問診療医になって、町の専門職とつながりながら患者さんを支えるレトロRPG。生きる事を嬉しく。こつこつクリニック">
<meta name="theme-color" content="#1d8b83">
<title>こつこつクリニック クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>/* こつこつクリニック クエスト - single committed daytime look (no dark theme by design). */
:root {
  --ink: #2e2a3a;
  --teal: #2bb3a8;
  --teal-deep: #135a5c;
  --teal-light: #7fe0d4;
  --window: rgba(16, 78, 82, 0.9);
  --window-solid: #10504f;
  --sky: #4fbdf0;
  --sky-pale: #bdebfc;
  --sun: #ffd45a;
  --paper: #ffffff;
  --grass: #7fd35c;
  --page: #a6e3fa;
  --danger: #ff9b8a;
  --font: "DotGothic16", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --controls-h: 176px;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--page);
  color: var(--paper);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
}

*, *::before, *::after { box-sizing: border-box; }
button { font-family: inherit; }
p, h1, h2, ol, ul { margin: 0; }
.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

#app {
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    linear-gradient(180deg, var(--sky) 0%, var(--sky-pale) 60%, var(--grass) 60%, #63b84a 100%);
}

#frame {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100%;
  overflow: hidden;
  background: #173c40;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

@media (min-width: 560px) and (min-height: 700px) {
  #frame {
    height: min(100%, 920px);
    border: 4px solid var(--paper);
    border-radius: 18px;
    box-shadow: 0 0 0 4px var(--ink), 0 20px 50px rgba(20, 60, 70, 0.35);
  }
}

.screen { position: absolute; inset: 0; }
.screen[hidden] { display: none !important; }

/* ---------- shared window & choice styles ---------- */
.window {
  background: var(--window);
  color: var(--paper);
  border: 3px solid var(--paper);
  border-radius: 8px;
  box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px rgba(0, 0, 0, 0.18);
}

.choice {
  position: relative;
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 8px 12px 8px 30px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--paper);
  font-size: 16px;
  line-height: 1.4;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.choice.is-active { background: rgba(255, 255, 255, 0.12); }
.choice.is-active::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 50%;
  margin-top: -6px;
  border-style: solid;
  border-width: 6px 0 6px 9px;
  border-color: transparent transparent transparent var(--sun);
  animation: nudge 0.8s steps(2) infinite;
}
.choice:disabled { opacity: 0.4; cursor: default; }
.choice:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }

@keyframes nudge { 50% { transform: translateX(3px); } }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- title ---------- */
#screen-title { display: flex; flex-direction: column; background: var(--sky); }
.title-sky { position: relative; flex: 0 0 40%; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.title-town { position: relative; flex: 1 1 auto; overflow: hidden; display: flex; justify-content: center; }
#title-sky { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
#title-town { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }

.logo {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 6%;
  font-weight: normal;
  line-height: 1.05;
  white-space: nowrap;
  text-align: center;
}
.logo-top {
  font-size: clamp(24px, 8.2vw, 38px);
  color: var(--paper);
  letter-spacing: 0.04em;
  text-shadow:
    2px 0 0 var(--teal-deep), -2px 0 0 var(--teal-deep), 0 2px 0 var(--teal-deep), 0 -2px 0 var(--teal-deep),
    2px 2px 0 var(--teal-deep), -2px 2px 0 var(--teal-deep), 2px -2px 0 var(--teal-deep), -2px -2px 0 var(--teal-deep),
    0 5px 0 var(--ink);
}
.logo-main {
  margin-top: 4px;
  font-size: clamp(50px, 17vw, 80px);
  color: var(--sun);
  letter-spacing: 0.08em;
  text-shadow:
    3px 0 0 var(--teal-deep), -3px 0 0 var(--teal-deep), 0 3px 0 var(--teal-deep), 0 -3px 0 var(--teal-deep),
    3px 3px 0 var(--teal-deep), -3px 3px 0 var(--teal-deep), 3px -3px 0 var(--teal-deep), -3px -3px 0 var(--teal-deep),
    0 7px 0 var(--ink);
}
.sound-chip {
  position: absolute;
  z-index: 2;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 12px;
  min-height: 40px;
  padding: 6px 12px;
  border: 2px solid var(--paper);
  border-radius: 20px;
  background: rgba(19, 90, 92, 0.85);
  color: var(--paper);
  font-size: 14px;
}
.title-bottom {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.title-menu { width: min(300px, 100%); padding: 8px; }
.title-menu .choice { font-size: 19px; }
.title-brand {
  padding: 4px 12px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.9);
  color: var(--teal-deep);
  font-size: 14px;
  box-shadow: 0 0 0 2px var(--ink);
}

/* ---------- setup ---------- */
#screen-setup {
  overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px;
  background: linear-gradient(180deg, var(--sky), var(--sky-pale));
}
.setup { max-width: 400px; margin: 0 auto; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.setup-heading { font-size: 20px; font-weight: normal; text-align: center; }
.setup-label { font-size: 15px; color: var(--teal-light); }
.name-row { display: flex; align-items: center; gap: 8px; }
#name-input {
  flex: 1;
  min-width: 0;
  height: 48px;
  padding: 0 12px;
  border: 3px solid var(--paper);
  border-radius: 6px;
  background: #0b3a3a;
  color: var(--paper);
  font-family: var(--font);
  font-size: 20px;
  -webkit-user-select: text;
  user-select: text;
}
#name-input:focus { outline: 3px solid var(--sun); outline-offset: 1px; }
.name-suffix { font-size: 18px; }
.setup-error { min-height: 1.4em; font-size: 14px; color: var(--danger); }
.avatar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.avatar-card {
  display: grid;
  grid-template-columns: auto auto;
  justify-content: center;
  align-items: end;
  gap: 6px 10px;
  padding: 12px 6px 10px;
  border: 3px solid rgba(255, 255, 255, 0.35);
  border-radius: 8px;
  background: linear-gradient(180deg, #8fdaf8 0 55%, var(--grass) 55%);
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
}
.avatar-card[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 2px var(--ink); }
.avatar-card span { grid-column: 1 / -1; padding: 2px 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.9); }
.avatar-walk { width: 48px; height: 72px; }
.avatar-face { width: 64px; height: 64px; background: rgba(255, 255, 255, 0.6); border-radius: 4px; }
.setup-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: 4px; }
.setup-actions .choice { border: 2px solid rgba(255, 255, 255, 0.4); }
#setup-start { background: var(--teal); border-color: var(--paper); }

/* ---------- game layout ---------- */
#screen-game { display: flex; flex-direction: column; }

#hud {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) 8px 6px;
  background: linear-gradient(180deg, #1d8b83, #16706a);
  border-bottom: 3px solid var(--paper);
  box-shadow: 0 2px 0 var(--ink);
  z-index: 5;
}
.hud-top { display: flex; align-items: center; gap: 6px; }
.hud-chapter { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--teal-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-objective-row { display: flex; align-items: flex-start; gap: 6px; }
.hud-tag { flex: 0 0 auto; padding: 1px 5px; border-radius: 3px; background: var(--sun); color: var(--ink); font-size: 12px; line-height: 1.5; }
.hud-objective { font-size: 15px; line-height: 1.35; }
.hud-objective.is-new { animation: blink 0.25s steps(1) 4; }
.hud-items { flex: 0 0 auto; display: flex; gap: 4px; }
.hud-items canvas { width: 28px; height: 28px; background: rgba(255, 255, 255, 0.92); border-radius: 4px; box-shadow: 0 0 0 2px var(--ink); }
.hud-btn {
  flex: 0 0 auto;
  min-height: 34px;
  min-width: 56px;
  padding: 3px 8px;
  border: 2px solid var(--paper);
  border-radius: 6px;
  background: var(--teal-deep);
  color: var(--paper);
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  touch-action: manipulation;
}
.hud-btn:focus-visible, .sound-chip:focus-visible, #btn-a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.menu-lines { width: 12px; height: 10px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; position: relative; }
.menu-lines::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; border-top: 2px solid currentColor; }

#viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: #2e2a3a;
  touch-action: none;
}
#world { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

/* ---------- dialogue ---------- */
#talk {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 8px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  pointer-events: none;
}
#talk > * { pointer-events: auto; }
.choices { width: min(100%, 320px); padding: 6px; max-height: 60vh; overflow-y: auto; }
.dlg { position: relative; width: 100%; padding: 16px 14px 14px; background: rgba(16, 78, 82, 0.86); cursor: pointer; }
.dlg.is-narration { background: rgba(28, 44, 60, 0.86); }
.dlg.is-thought .dlg-text { color: #d9f5ff; font-style: normal; }
.dlg-name {
  position: absolute;
  top: -15px;
  left: 10px;
  padding: 2px 10px;
  border-radius: 4px;
  background: var(--paper);
  color: var(--teal-deep);
  font-size: 14px;
  box-shadow: 0 0 0 2px var(--ink);
}
.dlg-name[hidden] { display: none; }
.dlg-body { display: flex; gap: 12px; align-items: flex-start; }
.dlg-face { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 4px; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 2px var(--ink); }
.dlg-face[hidden] { display: none; }
.dlg-text { flex: 1 1 auto; min-width: 0; min-height: calc(1.65em * 3); font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
.dlg-next {
  position: absolute;
  right: 12px;
  bottom: 6px;
  border-style: solid;
  border-width: 8px 6px 0 6px;
  border-color: var(--sun) transparent transparent transparent;
  opacity: 0;
}
.dlg.is-done .dlg-next { opacity: 1; animation: blink 0.8s steps(1) infinite; }

/* ---------- overlays ---------- */
#overlay { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#overlay > * { pointer-events: auto; }
.card-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(16, 40, 44, 0.45);
  cursor: pointer;
}
.card { width: min(100%, 360px); padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; animation: pop 0.25s ease-out; }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } }
.card-title { font-size: 18px; color: var(--sun); }
.card-text { font-size: 16px; line-height: 1.65; }
.card-eyebrow { font-size: 13px; color: var(--teal-light); letter-spacing: 0.08em; }
.card-hint { align-self: flex-end; font-size: 12px; color: var(--teal-light); }
.item-get { display: flex; gap: 12px; align-items: center; }
.item-get canvas { flex: 0 0 auto; width: 64px; height: 64px; background: rgba(255, 255, 255, 0.95); border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); }
.is-join .card { align-items: center; text-align: center; }
.join-rays { padding: 14px; border-radius: 50%; background: radial-gradient(circle, #fff6c0 0 45%, rgba(255, 214, 90, 0.5) 46% 60%, transparent 61%); }
.join-face { display: block; width: 96px; height: 96px; background: var(--paper); border-radius: 8px; box-shadow: 0 0 0 3px var(--ink); }
.join-title { font-size: 20px; }
.ability { width: 100%; padding: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); text-align: left; }
.ability-label { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 3px; background: var(--teal-light); color: var(--ink); font-size: 12px; }
.ability strong { font-weight: normal; font-size: 17px; color: var(--sun); }
.ability p { margin-top: 6px; font-size: 15px; line-height: 1.6; }
.lesson { font-size: 17px; }
.is-chapter .card { text-align: center; align-items: center; gap: 12px; }
.chapter-title { font-size: 26px; color: var(--sun); }
.chapter-sub { font-size: 16px; }
.chapter-foot { font-size: 14px; line-height: 1.6; color: var(--teal-light); }
.chapter-brand { margin-top: 4px; padding: 4px 10px; border-radius: 4px; background: var(--paper); color: var(--teal-deep); font-size: 14px; }
.howto { display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.6; }
.howto p { display: flex; gap: 10px; align-items: center; }
.key-a { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: var(--sun); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font: 700 16px Arial, sans-serif; }
.key-dpad { flex: 0 0 auto; width: 32px; height: 32px; position: relative; }
.key-dpad::before, .key-dpad::after { content: ""; position: absolute; background: var(--paper); border-radius: 2px; }
.key-dpad::before { left: 11px; top: 0; width: 10px; height: 32px; }
.key-dpad::after { top: 11px; left: 0; width: 32px; height: 10px; }
.phone { display: flex; gap: 14px; align-items: center; }
.phone-icon { flex: 0 0 auto; width: 34px; height: 48px; border-radius: 6px; background: var(--paper); box-shadow: 0 0 0 2px var(--ink); position: relative; animation: ring 0.18s steps(2) infinite; }
.phone-icon::before { content: ""; position: absolute; left: 5px; right: 5px; top: 6px; bottom: 12px; background: var(--teal); border-radius: 2px; }
.phone-icon::after { content: ""; position: absolute; left: 13px; bottom: 3px; width: 8px; height: 6px; border-radius: 3px; background: var(--teal-deep); }
@keyframes ring { 50% { transform: rotate(8deg); } }

/* menu */
.menu-wrap { position: absolute; inset: 0; padding: 10px; background: rgba(16, 40, 44, 0.5); display: flex; }
.menu { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px; }
.menu-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.menu h2 { font-size: 14px; font-weight: normal; color: var(--sun); margin-bottom: 6px; }
.menu-objective { font-size: 16px; }
.menu-synopsis { padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.6; }
.menu-party, .menu-items { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.menu-party li, .menu-items li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5; }
.menu-party canvas, .menu-items canvas { flex: 0 0 auto; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.92); border-radius: 4px; }
.menu-party strong, .menu-items strong { font-weight: normal; color: var(--teal-light); }
.menu-party p, .menu-items p { font-size: 14px; }
.muted { opacity: 0.75; }
.menu-actions { flex: 0 0 auto; display: grid; gap: 2px; padding-top: 8px; border-top: 2px solid rgba(255, 255, 255, 0.3); }

/* modal */
#modal { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.modal-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(16, 40, 44, 0.55); pointer-events: auto; }
.confirm { width: min(100%, 340px); padding: 16px 12px 10px; display: flex; flex-direction: column; gap: 12px; }
.confirm p { font-size: 16px; line-height: 1.6; padding: 0 4px; }

#fader { position: absolute; inset: 0; z-index: 60; background: #0d2a2d; opacity: 0; pointer-events: none; transition: opacity 0.22s linear; }
#fader.is-on { opacity: 1; pointer-events: auto; }
#flash { position: absolute; inset: 0; z-index: 61; background: #fff; opacity: 0; pointer-events: none; }
#flash.is-on { animation: flash 0.6s ease-out; }
@keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
#boot-error { position: absolute; inset: auto 16px 40% 16px; z-index: 70; padding: 12px; background: var(--window-solid); color: var(--paper); font-size: 16px; text-align: center; }

/* ---------- battle ---------- */
.battle { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #173c40; }
/* the picture takes whatever height is left and keeps its proportions inside it */
.battle-scene { flex: 1 1 0; min-height: 110px; width: 100%; object-fit: contain; object-position: 50% 100%; border: 3px solid var(--paper); border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); background: #9fe3ff; }
.battle-status { display: flex; gap: 10px; align-items: center; padding: 6px 10px; }
.battle-face { width: 48px; height: 48px; background: rgba(255, 255, 255, 0.9); border-radius: 4px; }
.battle-name { font-size: 16px; }
.battle-gauge-label { font-size: 12px; color: var(--teal-light); }
.battle-gauge { display: flex; gap: 4px; margin-top: 2px; }
.battle-gauge i { width: 26px; height: 10px; background: #9d86d2; box-shadow: 0 0 0 2px var(--ink); transition: background 0.3s; }
.battle-gauge i.is-off { background: rgba(255, 255, 255, 0.25); }
.battle-msg { position: relative; flex: 0 0 auto; min-height: 88px; padding: 12px 14px 18px; font-size: 16px; line-height: 1.65; }
.battle-msg::after { content: ""; position: absolute; right: 12px; bottom: 6px; border-style: solid; border-width: 8px 6px 0 6px; border-color: var(--sun) transparent transparent transparent; opacity: 0; }
.battle-msg.is-done::after { opacity: 1; animation: blink 0.8s steps(1) infinite; }
.battle-cmds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; }
.battle-cmds[hidden] { display: none; }
.battle-cmds .choice { padding: 8px 2px 8px 17px; font-size: 14px; white-space: nowrap; }
.battle-cmds .choice.is-active::before { left: 4px; }

.battle-cmds.is-two { grid-template-columns: repeat(2, 1fr); }
.battle-speaker { font-size: 13px; color: var(--teal-light); }
.battle-speaker[hidden] { display: none; }
.battle.is-boss { background: #1f2a4a; }
.battle.is-boss .battle-scene { background: #7fb4d8; }
.battle.is-boss .battle-gauge i { background: #6a5aa8; }
.battle.is-boss .battle-gauge i.is-off { background: #ffd45a; }

/* ---------- ending ---------- */
.ending { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #173c40; }
.ending-stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 3px solid var(--paper); border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); background: #2e2a3a; }
.ending-canvas { width: 100%; height: auto; aspect-ratio: 160 / 100; opacity: 0; transition: opacity 0.4s; }
.ending.is-shown .ending-canvas { opacity: 1; }
.ending-town { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.ending-town[hidden], .ending-canvas[hidden] { display: none; }
.ending-text { position: relative; flex: 0 0 auto; min-height: 112px; padding: 14px 16px 22px; display: flex; align-items: center; }
.ending-text p { font-size: 17px; line-height: 1.7; }
.ending-text.is-brand p { width: 100%; text-align: center; font-size: 21px; color: var(--sun); white-space: pre-line; }
.ending-text.is-last p { width: 100%; text-align: center; }
.ending-text::after { content: ""; position: absolute; right: 12px; bottom: 7px; border-style: solid; border-width: 8px 6px 0 6px; border-color: var(--sun) transparent transparent transparent; animation: blink 0.8s steps(1) infinite; }

/* ---------- minigame ---------- */
.minigame { position: absolute; inset: 0; padding: 6px; background: rgba(16, 40, 44, 0.6); display: flex; }
.mg-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--window-solid); }
.mg-head { display: flex; gap: 10px; align-items: baseline; }
.mg-step { flex: 0 0 auto; padding: 1px 6px; border-radius: 3px; background: var(--sun); color: var(--ink); font-size: 12px; }
.mg-title { font-size: 16px; }
.mg-scene { flex: 1 1 0; min-height: 110px; width: 100%; object-fit: contain; background: #0e2a2c; border: 3px solid var(--paper); border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); touch-action: none; }
.mg-talk { position: relative; flex: 0 0 auto; padding: 8px 10px 16px; border-radius: 6px; background: rgba(0, 0, 0, 0.18); cursor: pointer; }
.mg-speaker { font-size: 13px; color: var(--teal-light); }
.mg-speaker[hidden] { display: none; }
.mg-text { font-size: 16px; line-height: 1.6; }
.mg-talk::after { content: ""; position: absolute; right: 10px; bottom: 5px; border-style: solid; border-width: 8px 6px 0 6px; border-color: var(--sun) transparent transparent transparent; opacity: 0; }
.mg-talk.is-done::after { opacity: 1; animation: blink 0.8s steps(1) infinite; }
.mg-actions { flex: 0 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }

/* ---------- controls ---------- */
#controls {
  flex: 0 0 auto;
  height: calc(var(--controls-h) + env(safe-area-inset-bottom, 0px));
  padding: 14px 26px calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 8px),
    linear-gradient(180deg, #2c9a91, #1d7d76);
  border-top: 3px solid var(--paper);
  box-shadow: 0 -2px 0 var(--ink);
  touch-action: none;
}
#dpad {
  position: relative;
  width: 144px;
  height: 144px;
  flex: 0 0 auto;
  touch-action: none;
  cursor: pointer;
}
#dpad::before, #dpad::after {
  content: "";
  position: absolute;
  background: #f4fbfa;
  border-radius: 8px;
  box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px rgba(0, 0, 0, 0.25);
}
#dpad::before { left: 48px; top: 0; width: 48px; height: 144px; }
#dpad::after { top: 48px; left: 0; width: 144px; height: 48px; }
.dpad-arrow { position: absolute; z-index: 1; width: 0; height: 0; border-style: solid; pointer-events: none; }
.dpad-arrow.up { left: 62px; top: 14px; border-width: 0 10px 14px 10px; border-color: transparent transparent var(--teal-deep) transparent; }
.dpad-arrow.down { left: 62px; bottom: 14px; border-width: 14px 10px 0 10px; border-color: var(--teal-deep) transparent transparent transparent; }
.dpad-arrow.left { top: 62px; left: 14px; border-width: 10px 14px 10px 0; border-color: transparent var(--teal-deep) transparent transparent; }
.dpad-arrow.right { top: 62px; right: 14px; border-width: 10px 0 10px 14px; border-color: transparent transparent transparent var(--teal-deep); }
#dpad[data-dir="up"] .up { border-bottom-color: var(--sun); }
#dpad[data-dir="down"] .down { border-top-color: var(--sun); }
#dpad[data-dir="left"] .left { border-right-color: var(--sun); }
#dpad[data-dir="right"] .right { border-left-color: var(--sun); }
#btn-a {
  flex: 0 0 auto;
  width: 88px;
  height: 88px;
  margin-right: 4px;
  border: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe89a, var(--sun) 55%, #e0ad2e);
  color: var(--ink);
  font-family: "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  font-weight: 700;
  font-size: 32px;
  box-shadow: 0 0 0 3px var(--ink), 0 6px 0 3px rgba(0, 0, 0, 0.25);
  touch-action: none;
  cursor: pointer;
}
#btn-a.is-down { transform: translateY(3px); box-shadow: 0 0 0 3px var(--ink), 0 3px 0 3px rgba(0, 0, 0, 0.25); }

/* Short phones */
@media (max-height: 700px) {
  :root { --controls-h: 150px; }
  #dpad { transform: scale(0.86); }
  #btn-a { width: 78px; height: 78px; }
  .dlg-text { font-size: 15px; }
}

/* Landscape phones: controls move to the sides of the map */
@media (orientation: landscape) and (max-height: 540px) {
  #frame { max-width: none; }
  #screen-game {
    display: grid;
    grid-template-columns: 170px 1fr 130px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "hud hud hud" "dpad view abtn";
  }
  #hud { grid-area: hud; }
  #viewport { grid-area: view; }
  #controls { display: contents; }
  #dpad { grid-area: dpad; align-self: center; justify-self: center; transform: scale(0.9); }
  #btn-a { grid-area: abtn; align-self: center; justify-self: center; }
  #screen-game { background: #1d7d76; }
  .title-sky { flex-basis: 48%; }
  .logo-main { font-size: clamp(40px, 12vh, 64px); }
  .logo-top { font-size: clamp(20px, 6vh, 32px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

<body>
<div id="app">
  <div id="frame">

    <section id="screen-title" class="screen" aria-label="タイトル">
      <div id="title-sky-box" class="title-sky">
        <canvas id="title-sky" class="pixel"></canvas>
        <h1 class="logo"><span class="logo-top">こつこつクリニック</span><span class="logo-main">クエスト</span></h1>
        <button type="button" class="sound-chip" data-sound-toggle aria-pressed="false">音：切</button>
      </div>
      <div id="title-town-box" class="title-town">
        <canvas id="title-town" class="pixel"></canvas>
        <div class="title-bottom">
          <div id="title-menu" class="window title-menu">
            <button type="button" class="choice" data-act="new">はじめから</button>
            <button type="button" class="choice" data-act="continue">つづきから</button>
          </div>
          <p class="title-brand">生きる事を嬉しく。こつこつクリニック</p>
        </div>
      </div>
    </section>

    <section id="screen-setup" class="screen" aria-label="はじめる準備" hidden>
      <div class="window setup">
        <h2 class="setup-heading">あなたのことを教えてください</h2>
        <label class="setup-label" for="name-input">名前（1〜8文字）</label>
        <div class="name-row">
          <input id="name-input" type="text" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" value="コツコツ">
          <span class="name-suffix">先生</span>
        </div>
        <p id="name-error" class="setup-error" role="alert"></p>
        <p class="setup-label">あなたの姿を選んでください</p>
        <div class="avatar-row">
          <button type="button" class="avatar-card" data-avatar="doctorA" aria-pressed="true">
            <canvas class="avatar-walk pixel" width="16" height="24"></canvas>
            <canvas class="avatar-face pixel" width="32" height="32"></canvas>
            <span>男性の医師</span>
          </button>
          <button type="button" class="avatar-card" data-avatar="doctorB" aria-pressed="false">
            <canvas class="avatar-walk pixel" width="16" height="24"></canvas>
            <canvas class="avatar-face pixel" width="32" height="32"></canvas>
            <span>女性の医師</span>
          </button>
        </div>
        <div class="setup-actions">
          <button type="button" class="choice" id="setup-back">もどる</button>
          <button type="button" class="choice is-active" id="setup-start">この姿で始める</button>
        </div>
      </div>
    </section>

    <section id="screen-game" class="screen" aria-label="ゲーム" hidden>
      <header id="hud">
        <div class="hud-top">
          <p id="hud-chapter" class="hud-chapter"></p>
          <div id="hud-items" class="hud-items" aria-label="持っている機器"></div>
          <button type="button" class="hud-btn" data-sound-toggle aria-pressed="false">音：切</button>
          <button type="button" class="hud-btn" id="btn-menu"><span class="menu-lines" aria-hidden="true"></span>メニュー</button>
        </div>
        <p class="hud-objective-row"><span class="hud-tag">目的</span><span id="hud-objective" class="hud-objective"></span></p>
      </header>
      <div id="viewport">
        <canvas id="world" class="pixel"></canvas>
        <div id="talk">
          <div id="choices" class="window choices" hidden></div>
          <div id="dialogue" class="window dlg" hidden aria-live="polite">
            <p class="dlg-name"></p>
            <div class="dlg-body">
              <canvas class="dlg-face pixel" width="32" height="32"></canvas>
              <p class="dlg-text"></p>
            </div>
            <span class="dlg-next" aria-hidden="true"></span>
          </div>
        </div>
        <div id="overlay"></div>
      </div>
      <div id="controls">
        <div id="dpad" role="group" aria-label="十字キー">
          <span class="dpad-arrow up"></span><span class="dpad-arrow down"></span>
          <span class="dpad-arrow left"></span><span class="dpad-arrow right"></span>
        </div>
        <button type="button" id="btn-a" aria-label="Aボタン（話す・調べる・決定）">A</button>
      </div>
    </section>

    <div id="modal"></div>
    <div id="fader"></div>
    <div id="flash"></div>
    <p id="boot-error" hidden>読み込みに失敗しました。ページを再読み込みしてください。</p>
  </div>
